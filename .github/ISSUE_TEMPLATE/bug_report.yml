name: Bug report
description: Report a reproducible Job Buddy problem using synthetic data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use fictional data only. Do not upload resumes, real trackers, private emails, OAuth values, tokens, cookies, candidate profiles, pairing codes, or job-site form answers. Report vulnerabilities through SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0-beta.18 or commit hash
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Tracker/import/export, Gmail, Browser Buddy, Profile, Salary research, Discovery, Setup/build, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest steps and fictional inputs that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/version, browser/version, source build or package version, and Node/npm/command if relevant. Full macOS support is still planned. Redact personal paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed resumes, private mail, personal data, secrets, tokens, cookies, pairing codes, and real form answers from this report and its attachments.
          required: true
        - label: This is not a security vulnerability; if it is, I will use the private process in SECURITY.md.
          required: true
